services:
  proxy:
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  gui:
    environment:
      DNLABGUI_CONFIG_WRITABLE: "false"
    volumes:
      - ${DNLAB_CONFIG_DIR:-/etc/dnlab}:/etc/dnlab:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run

  auth-seed:
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run

  auth-db:
    security_opt:
      - no-new-privileges:true

  image-build:
    security_opt:
      - no-new-privileges:true

  lab-cleanup:
    security_opt:
      - no-new-privileges:true

  image-sync:
    security_opt:
      - no-new-privileges:true
