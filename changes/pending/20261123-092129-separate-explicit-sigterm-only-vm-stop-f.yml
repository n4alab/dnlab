title: Separate explicit SIGTERM-only VM stop from NOS shutdown
description: Add an explicit libvirt graceful-stop policy and distinct original-pidfd
  exit receipt, preserve NOS ACPI qualification and refuse method switching or forced
  flags. Support proven monitored-paused guests without CPU resume, retain disks and
  TAPs, and recover uncertain stop responses without a second request.
