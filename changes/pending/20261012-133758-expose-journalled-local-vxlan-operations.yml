title: Expose journalled local VXLAN operations for committed runtime nodes
description: Add optional Unix API and CLI routes for VXLAN plan, queued create/delete/recover,
  status, cancellation and inspection. Requests validate committed node revision and
  exact endpoint ownership, serialize with node operations, preserve pre-existing
  links on interrupted retries, and require local link teardown before node stop.
