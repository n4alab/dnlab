id: 20261024-141738-honor-generic-vm-per-node-cpu-and-ram-ov
type: bugfix
title: Honor generic VM per-node CPU and RAM overrides
description: Resolve VCPU and RAM before QEMU construction in the generic VM launcher,
  with numeric QEMU aliases as fallback and the build profile as final default. Validate
  bounds and normalize the aliases so older vrnetlab properties cannot override the
  requested node resources.
