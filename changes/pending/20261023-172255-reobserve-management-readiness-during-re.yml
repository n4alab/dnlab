title: Reobserve management readiness during release recovery
description: Preserve the original sealed management attestation and reobserve every
  original host before each remote release, including recovery. Persist successful
  checks before remote mutation and retain partial-release state on missing or replaced
  resources, unavailable hosts or checkpoint errors.
