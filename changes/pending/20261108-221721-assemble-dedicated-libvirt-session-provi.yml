title: Assemble dedicated libvirt session provisioning components
description: Compose the original snapshot, explicit provisioning window, directory
  dependencies, account identity/helper and file adapter around one journal. Keep
  prepare and apply separate, with no default host worker or NSS provider. Four synthetic
  prepare/conflict cases and one temporary-filesystem apply/replay case pass without
  real account commands or daemon activation.
