title: Bind managed initial workloads to their original network-service release
description: Add an opt-in managed topology handoff that atomically stores the original
  management parent with all initial workload intents. Preserve the released ledger,
  service model, runtime targets, journal identities and lab generation; revalidate
  the parent during apply, recovery, cancellation and binding publication, rejecting
  replacement without new mutations.
