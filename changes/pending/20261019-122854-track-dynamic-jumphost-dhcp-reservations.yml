type: bugfix
title: Track dynamic jumphost DHCP reservations
description: Separate fixed DHCP configuration from generation-qualified reservation
  and option files, journal updates and recovery, verify dnsmasq process identity
  before reload, and preserve legacy layouts without implicit recreation.
