type: bugfix
title: Track runtime relay ownership and recovery
description: Persist relay birth intent before creation and verify its Docker generation
  and configuration before reuse or cleanup. Refuse unqualified replacements and capability
  changes, recover uncertain responses without duplicate allocation, and preserve
  teardown state until qualified relay cleanup is verified. Ensure preflight rejects
  unavailable active relays and pending journals on every host before any allocation,
  while qualified absence remains valid for cleanup.
