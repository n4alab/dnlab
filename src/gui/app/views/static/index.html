<!-- ── Toolbar ─────────────────────────────────────────────────────── -->

    <span class="brand-text">dNLab</span>

  <div class="lab-context canvas-only"><span>Labs</span><span class="context-slash">/</span><strong id="topo-name-display">(no topology)</strong><span id="lab-status-badge" class="status-badge status-stopped">stopped</span></div>
  <div class="toolbar-lifecycle canvas-only"><button id="btn-deploy" class="btn btn-start" title="Start lab"><svg class="icon"><use href="#i-play"/></svg>Start</button><button id="btn-destroy" class="btn btn-stop" title="Stop lab"><svg class="icon"><use href="#i-square"/></svg>Stop</button><button id="btn-all-consoles" class="btn" title="Open all live VD consoles" disabled><svg class="icon"><use href="#i-terminal"/></svg>Consoles</button><button id="btn-all-logs" class="btn" title="Open all live VD logs" disabled><svg class="icon"><use href="#i-file-text"/></svg>VD Logs</button></div>

  <div class="toolbar-menu canvas-only"><button id="btn-more-menu" class="icon-btn" type="button" title="More lab actions"><svg class="icon"><use href="#i-more"/></svg></button><div id="more-menu" class="app-menu-popover" hidden><button id="btn-delete-topo" class="menu-danger" type="button"><svg class="icon"><use href="#i-trash"/></svg>Delete lab</button></div></div>
  <div class="toolbar-spacer"></div>
  <div class="toolbar-menu"><button id="btn-user-menu" class="user-badge" type="button" title="Current user"><svg class="icon"><use href="#i-user"/></svg><span id="user-badge"></span></button><div id="user-menu" class="app-menu-popover user-menu" hidden><button id="btn-labs" type="button">Labs</button><button id="view-admin" type="button" hidden>Admin</button><label class="theme-menu-label">Theme <select id="theme-select" class="theme-select"><option value="dark">Dark</option><option value="light">Light</option></select></label><button id="btn-logout" type="button">Logout</button></div></div>

    </div>
    <button id="btn-follow-rabbit" class="follow-rabbit-trigger" type="button"><svg class="icon"><use href="#i-search"/></svg>Follow the Rabbit</button>
    <div id="canvas-view-controls" class="canvas-view-controls" role="toolbar" aria-label="Canvas view"><button id="btn-fit" class="icon-btn" title="Fit canvas" aria-label="Fit canvas"><svg class="icon"><use href="#i-maximize"/></svg></button><button id="btn-toggle-mgmt" class="icon-btn active" title="Show management network (M)" aria-label="Toggle management network"><svg class="icon"><use href="#i-globe"/></svg></button><button id="btn-zoom-in" class="icon-btn" title="Zoom in" aria-label="Zoom in"><svg class="icon"><use href="#i-plus"/></svg></button><button id="btn-zoom-out" class="icon-btn" title="Zoom out" aria-label="Zoom out">−</button></div>

    <!-- Pannello inferiore: console + log (condiviso) -->

      <div id="console-term-area"></div>
    </div>
  </div>
  <div id="mgmt-panel" hidden></div>
</div>

<aside id="workspace-drawer" hidden aria-label="Lab tools"><div class="drawer-header"><div class="drawer-tabs" role="tablist"><button class="drawer-tab active" data-drawer-tab="properties" type="button">Properties</button><button class="drawer-tab" data-drawer-tab="rabbit" type="button">Follow the Rabbit</button></div><button id="btn-close-drawer" class="icon-btn" title="Close panel" aria-label="Close panel">×</button></div><div id="props-panel" class="drawer-content"></div><div id="rabbit-panel" class="drawer-content" hidden></div></aside>

	<!-- ── Keyboard shortcuts & theme ────────────────────────────────────── -->
	<script>
	  document.addEventListener('keydown', e => {
	    if (document.getElementById('admin-view')?.classList.contains('active')) return;
	    if (e.ctrlKey && e.key === 's') { e.preventDefault(); }
    if ((e.key === 'Delete' || e.key === 'Backspace') && document.activeElement === document.body)
      document.getElementById('btn-delete')?.click();
    if ((e.key === 'v' || e.key === 'V') && !_isTypingTarget(e.target)) document.getElementById('btn-mode-select')?.click();
    if ((e.key === 'l' || e.key === 'L') && !_isTypingTarget(e.target)) document.getElementById('btn-mode-link')?.click();
    if ((e.key === 'n' || e.key === 'N') && !e.shiftKey && !_isTypingTarget(e.target)) { e.preventDefault(); document.getElementById('btn-add-note')?.click(); }
    if ((e.key === 'r' || e.key === 'R') && !_isTypingTarget(e.target)) { e.preventDefault(); document.getElementById('btn-add-rect')?.click(); }
    if ((e.key === 'o' || e.key === 'O') && !_isTypingTarget(e.target)) { e.preventDefault(); document.getElementById('btn-add-ellipse')?.click(); }
    if ((e.key === 'm' || e.key === 'M') && !_isTypingTarget(e.target)) {
      e.preventDefault();
      Toolbar.toggleMgmtVisible?.();
    }
    if ((e.key === 'n' || e.key === 'N') && e.shiftKey && !_isTypingTarget(e.target)) {
      e.preventDefault();
      Canvas.toggleRealNetInfoVisible?.();
    }
  });
  function _isTypingTarget(el) {
    if (!el) return false;
    const tag = (el.tagName || '').toLowerCase();
    return tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable;
  }
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) hideModal();
  });

  // Theme switcher
  (() => {
    const sel = document.getElementById('theme-select');
    const saved = localStorage.getItem('dnlab-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    sel.value = saved;
    sel.addEventListener('change', () => {
      const theme = sel.value;
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('dnlab-theme', theme);
      if (typeof Canvas !== 'undefined') Canvas.setTheme(theme);
    });
  })();
</script>
